apiVersion: v1
kind: ConfigMap
metadata:
  name: stellar-operator-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
data:
  # Feature flags — set to "true" or "false" to toggle at runtime without restart.
  # Only enable_dr remains; it gates DR / cross-region Helm resources.
  # See README.md and src/controller/feature_flags.rs for documentation.
  enable_dr: {{ .Values.featureFlags.enableDr | quote }}
