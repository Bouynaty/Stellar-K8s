name: Kubernetes Resource Validation

on:
  push:
    branches: [ main, release-* ]
    paths:
      - 'config/**'
      - 'charts/**'
      - 'examples/**'
      - 'bundle/**'
      - 'scripts/validate-k8s-manifests.py'
      - '.github/workflows/k8s-manifest-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'config/**'
      - 'charts/**'
      - 'examples/**'
      - 'bundle/**'
      - 'scripts/validate-k8s-manifests.py'
      - '.github/workflows/k8s-manifest-validation.yml'

jobs:
  validate-manifests:
    name: Kubeconform & CRD Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Setup Kubeconform
        uses: github/super-linter/providers/kubeconform@v5
        continue-on-error: true

      - name: Validate Manifests and CRD Schemas
        run: |
          python3 scripts/validate-k8s-manifests.py
