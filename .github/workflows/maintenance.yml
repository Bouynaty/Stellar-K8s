name: Maintenance

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  stale-artifact-audit:
    name: Stale Artifact Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-maintenance"

      - name: Run stale artifact cleanup regression tests
        run: cargo test stale_artifact_cleanup -- --nocapture

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "maintenance-audit"
          extra-tools: "cargo-audit"

      - name: Install cargo-audit
        run: |
          for i in 1 2 3; do
            cargo install cargo-audit --locked && break
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

      - name: Run security audit
        run: cargo audit

  docs-health:
    name: Docs Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check documentation links
        run: python3 scripts/check-links.py
