[package]
name = "fee-bumper"
version = "0.1.0"
edition = "2021"
authors = ["Stellar K8s Contributors"]
description = "Automated Fee-Bump Transaction Wrapper for Stellar relayer nodes"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }


