[package]\nname = "stellar-k8s"\n
version = "0.1.0"\nedition = "2021"\nauthors = ["Stellar K8s Contributors"]\ndescription = "Cloud-Native Kubernetes Operator for Stellar Infrastructure"\nlicense = "Apache-2.0"\nrepository = "https://github.com/stellar/stellar-k8s"\n\n[lib]\nname = "stellar_k8s"\npath = "src/lib.rs"\n\n[dependencies]\ned25519-dalek = { version = "2", features = ["rand_core"] }\ntoml = "0.8"\n# Glob pattern matching for label propagation filters\nglob = "0.3"\n\n# Kubernetes client and operator framework\nkube = { version = "0.94", features = ["runtime", "derive", "unstable-runtime", "admission", "client", "ws"] }\nkube-runtime = { version = "0.94", features = ["unstable-runtime"] }\nk-8is-openapi = { version = "0.22", default-features = false, features = ["\nv1_30",\n
] \n\n# Async runtime\ntokio = { version = "1", features = ["full"] }\ntokio-util = { version = "0.7", features = ["io"] }\nfutures = "0.3"\n\n# Serialization\nserde = { version = "1", features = ["derive"] }\nserde_json = "1"\nserde_yaml = "0.9"\n\n# Schema generation for CRDs\nschemars = "0.8"\n\n# Error handling\nthiserror = "1"\nanyhow = "1"\n\n# CLI argument parsing\nclap = { version = "4.5", features = ["derive", "env"] }\nclap_complete = "4.5"\n\n# Date/time handling\nchrono = { version = "0.4", features = ["serde"] }\n# Pinned to fix RUSTSEC-2026-0009 (stack exhaustion DoS); also used transitively\n# by rcgen/yasna/x509-parser.\ntime = { version = "0.3.47", optional = true }\n# Pinned to fix RUSTSEC-2026-0007; used transitively by many HTTP/async crates.\nbytes = { version = "1.11.1", optional = true }\n\n# Zip compression for incident reports\nzip = "2"\n\n# Hostname for leader election\nhostname = "0.4"\n\n# Regex for log scrubbing patterns\nregex = "1"\n\n# Logging and tracing\ntracing = "0.1"\ntracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }\ntracing-opentemetry = "0.22"\n\n# OpenTelemetry for distributed tracing\nopentelemetry = "0.21"\nopentelemetry_sdk = { version = "0.21", features = ["rt-tokio", "trace"] }\nopentelemetry-otlp = { version = "0.14", features = [\n   "grpc-tonic",\n   "http-proto",\n] }\n\n# HTTP client for health checks\nreqwest = { version = "0.12", features = [\n   "json",\n   "rustls-tls-manual-roots",\n   "native-tls",\n   "multipart",\n] }\n\n# Kafka client for SCP analytics pipeline\nrdkafka = { version = "0.36", features = ["cmake-build", "ssl", "sasl"] }\n\n# REST API (optional)\naxum = { version = "0.8.8", optional = true, features = ["ws"] }\ntower = { version = "0.4", optional = true }\ntower-http = { version = "0.5", features = ["trace"], optional = true }\n\n# Metrics\nprometheus-client = { version = "0.22", optional = true }\nonce_cell = { version = "1", optional = true }\n\n# TLS and certificate generation\nrustls = "0.23"\nrcgen = { version = "0.13", features = ["pem", "x509-parser"] }\naxum-server = { version = "0.7.0", features = ["tls-rustls"] }\nrustls-pki-types = "1.14.0"\nx509-parser = "0.16"\n\n# Bounded Soroban RPC cache primitives and Wasm guest\nstellar-wasm-cache = { path = "wasm-plugins" }\n\n# Wasm runtime for custom validation plugins\nwasmtime = { version = "24.0.7", optional = true }\nwasmtime-wasi = { version = "24.0.7", features = ["preview1"], optional = true }\n\n# Additional crypto for webhook TLS\ntokio-rustls = "0.26"\n\n# Base64 for Wasm plugin loading\nbase64 = "0.21"\n\n# HMAC-SHA256 for webhook payload signing\nhmac = "0.12"\n\n# SHA256 for plugin integrity verification\nsha2 = "0.10"\nhex = "0.4"\nrand = "0.8"\nrand_distr = "0.5.1"\n\n# Backup scheduler dependencies\ncron = "0.15"\nflate2 = "1"\nasync-trait = "0.1"\nsqlx = { version = "0.8.6", default-features = false, features = [\n   "runtime-tokio",\n   "postgres",\n   "chrono",\n] }\npqcrypto-dilithum = "0.5.0"\npqcrypto-kyber = "0.8.1"\npqcrypto-traits = "0.3.5"\ncomfy-table = "7.2.2"\ncsv = "1.4.0"\nurl = "2.5"\nurlencoding = "2.1"\naws-sdk-s3 = "1.131.0"\naws-config = "1.8.16"\nserde_json_diff = "0.2.0"\njson-patch = "4.1.0"\nmd5 = "0.8.0"\n\n[build-dependencies]\nchrono = "0.4"\nserde_json = "1"\nwalkdir = "2"\nserde = { version = "1", features = ["derive"] }\n\n[features]\ndefault = ["rest-api", "metrics", "admission-webhook", "k8s-v1-30"]\nrest-api = ["axum", "tower", "tower-http"]\nmetrics = ["prometheus-client", "once_cell"]\nadmission-webhook = [\n    "wasmtime",\n    "wasmtime-wasi",\n    "axum",\n    "tower",\n    "tower-http",\n]\naxum = ["dep:axum"]\n# Expose reconciler for state-machine fuzzing (reconcile_no_panic, event sequences)\nreconciler-fuzz = []\n\n# Kubernetes API version selection (exactly one must be enabled)\nk8s-v1-30 = ["k8-openapi/v1_30"]\n\n[dev-dependencies]\ntokio-test = "0.4"\ntempfile = "3"\nwiremock = "=0.6.5"\nproptest = "1.5"\nwat = "1.246"\n# Ensure dev builds that pull k8-openapi 0.22 have an explicit API version feature.\nk8-openapi = { version = "0.22", default-features = false, features = ["v1_30"] }\n\n[[bin]]\nname = "stellar-operator"\npath = "src/main.rs"\n\n[[bin]]\nname = "stellar-sidecar"\npath = "src/sidecar.rs"\n\n[[bin]]\nname = "kubectl-stellar"\npath = "src/kubectl_plugin.rs"\n\n[[bin]]\nname = "stellar-completions"\npath = "src/bin/completions.rs"\n\n[[bin]]\nname = "soroban-cache-proxy"\npath = "src/bin/soroban-cache-proxy.rs"\n\n# Bylantine Monitoring Watcher — deployed as a sidecar in multiple cloud regions\n# to detect local vs. global consensus issues (Byzantine partition detection).\n[[bin]]\nname = "stellar-watcher"\npath = "src/bin/stellar-watcher.rs"\nrequired-features = ["rest-api", "metrics"]\n\n# Fork Detection Sidecar — compares local ledger hash against public anchors\n# to detect potential network forks early.\n[[bin]]\nname = "stellar-fork"\npath = "src/bin/stellar-fork-detector.rs"\nrequired-features = ["rest-api", "metrics"]\n\n[workspace]\nmembers = ["wasm-plugins"]\n\n[profile.release.package.stellar-wasm-cache]\nopt-level = "z"\nlto = true\ncodegen-units = 1\npanic = "abort"\nstrip = true\n