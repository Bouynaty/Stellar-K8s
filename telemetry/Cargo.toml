[package]
name = "stellar-telemetry"
version = "0.1.0"
edition = "2021"
authors = ["Stellar K8s Contributors"]
description = "PromQL Metrics Exporter for Soroban Smart Contract Gas Profiling"
license = "Apache-2.0"
repository = "https://github.com/stellar/stellar-k8s"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8.8"
prometheus-client = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
reqwest = "0.12"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser_throughput"
harness = false
