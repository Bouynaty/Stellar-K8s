# SPDX-License-Identifier: Apache-2.0
# kube-bench custom benchmark controls for Stellar-K8s (issue #1380).
#
# This file is a kube-bench *control* set (not a Kubernetes manifest). It is
# mounted into the in-cluster Job at /opt/kube-bench/cfg/stellar-bench.yaml
# and selected with:  kube-bench run --benchmark stellar-bench --output json
#
# It is a curated subset of the CIS Benchmark families plus Stellar-K8s
# hardening requirements on control-plane components and kubelets that run
# operator-managed workloads.

controls:
- id: 1
  text: "Control Plane Components"
  type: "controlplane"
  groups:
  - id: 1.1
    text: "Control Plane Node Configuration Files"
    type: "manual"
    checks:
    - id: 1.1.1
      text: "Ensure that the API server pod specification file permissions are set to 644 or more restrictive"
      type: "manual"
      remediation: "chmod 644 /etc/kubernetes/manifests/kube-apiserver.yaml"
    - id: 1.1.2
      text: "Ensure that the API server pod specification file ownership is set to root:root"
      type: "manual"
      remediation: "chown root:root /etc/kubernetes/manifests/kube-apiserver.yaml"
  - id: 1.6
    text: "API Server: authentication and TLS"
    type: "scored"
    checks:
    - id: 1.6.3
      text: "Ensure that the --anonymous-auth argument is set to false (Automated)"
      audit: "ps -ef | grep kube-apiserver | grep -v grep"
      tests:
        test_items:
        - flag: "--anonymous-auth"
          compare:
            op: eq
            value: false
          set: true
      remediation: "Set --anonymous-auth=false on the API server pod specification."
      scored: true
    - id: 1.6.8
      text: "Ensure that the API server authorization mode does not fall back to AlwaysAllow (Manual)"
      type: "manual"
      remediation: "Set --authorization-mode to RBAC or Node,RBAC on the API server."
  - id: 1.7
    text: "Scheduler"
    type: "manual"
    checks:
    - id: 1.7.1
      text: "Ensure that the scheduler health check bind address is 127.0.0.1"
      type: "manual"
      remediation: "Set --bind-address=127.0.0.1 on the kube-scheduler."

- id: 2
  text: "Node Components"
  type: "node"
  groups:
  - id: 2.1
    text: "Kubelet authentication and TLS"
    type: "scored"
    checks:
    - id: 2.1.1
      text: "Ensure that the kubelet client certificate keys are owned by root:root (Manual)"
      type: "manual"
      remediation: "chown root:root on all kubelet client certificate key files."
    - id: 2.1.2
      text: "Ensure that the --anonymous-auth argument on the kubelet is set to false (Automated)"
      audit: "ps -ef | grep kubelet | grep -v grep"
      tests:
        test_items:
        - flag: "--anonymous-auth"
          compare:
            op: eq
            value: false
          set: true
      remediation: "Edit /etc/systemd/system/kubelet.service on the node and set --anonymous-auth=false."
      scored: true
    - id: 2.1.3
      text: "Ensure that the kubelet serves only HTTPS (Automated)"
      audit: "ps -ef | grep kubelet | grep -v grep"
      tests:
        test_items:
        - flag: "--read-only-port"
          compare:
            op: eq
            value: "0"
          set: true
      remediation: "Set --read-only-port=0 on all kubelet configs."
      scored: true
  - id: 2.2
    text: "Kubelet configuration files"
    type: "scored"
    checks:
    - id: 2.2.2
      text: "Ensure that the kubelet configuration file has permissions 644 or more restrictive (Manual)"
      type: "manual"
      remediation: "chmod 644 on the kubelet config file."