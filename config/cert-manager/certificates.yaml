# cert-manager Configuration for Stellar Network
# Deploys cert-manager with Let's Encrypt for automatic certificate management

apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: stellar-network
    purpose: certificate-management
---
# Install cert-manager via Helm
# This is a template - in production, use Helm chart directly
apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager-values
  namespace: cert-manager
  labels:
    app: cert-manager
data:
  values.yaml: |
    installCRDs: true
    replicaCount: 2
    leaderElection:
      namespace: cert-manager
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    webhook:
      replicaCount: 2
    cainjector:
      replicaCount: 2
---
# Let's Encrypt ClusterIssuer for production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: cert-manager
    environment: production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@stellar.org
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        ingress:
          class: nginx
---
# Let's Encrypt ClusterIssuer for staging
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app: cert-manager
    environment: staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@stellar.org
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
    - http01:
        ingress:
          class: nginx
---
# Certificate for Stellar Horizon API
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stellar-horizon-tls
  namespace: stellar
  labels:
    app: stellar-horizon
    component: tls
spec:
  secretName: stellar-horizon-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: horizon.stellar.org
  dnsNames:
  - horizon.stellar.org
  - api.stellar.org
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
  - server auth
  - digital signature
  - key encipherment
---
# Certificate for Stellar Validator
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stellar-validator-tls
  namespace: stellar
  labels:
    app: stellar-validator
    component: tls
spec:
  secretName: stellar-validator-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: validator.stellar.org
  dnsNames:
  - validator.stellar.org
  - stellar-validator-0.stellar.svc.cluster.local
  - stellar-validator-1.stellar.svc.cluster.local
  - stellar-validator-2.stellar.svc.cluster.local
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
  - server auth
  - digital signature
  - key encipherment
---
# Certificate for Stellar Core
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stellar-core-tls
  namespace: stellar
  labels:
    app: stellar-core
    component: tls
spec:
  secretName: stellar-core-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: core.stellar.org
  dnsNames:
  - core.stellar.org
  - stellar-core.stellar.svc.cluster.local
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
  - server auth
  - digital signature
  - key encipherment
---
# Ingress with TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stellar-horizon-ingress
  namespace: stellar
  labels:
    app: stellar-horizon
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - horizon.stellar.org
    - api.stellar.org
    secretName: stellar-horizon-tls
  rules:
  - host: horizon.stellar.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stellar-horizon
            port:
              number: 8000
  - host: api.stellar.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stellar-horizon
            port:
              number: 8000
